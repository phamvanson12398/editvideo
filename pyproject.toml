[project]
name = "director-video"
version = "0.1.0"
description = "Director: AI video editor (Remotion + ffmpeg + Claude)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",
    "pyyaml>=6.0",
    "anthropic>=0.70",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
ocr = ["rapidocr-onnxruntime>=1.3", "opencv-python>=4.9,<5"]
separation = ["demucs>=4.0"]
diarize = ["pyannote.audio>=3.1"]
studio = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
export = ["opentimelineio>=0.17"]
all = [
    "faster-whisper>=1.1",
    "rapidocr-onnxruntime>=1.3",
    "opencv-python>=4.9,<5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "opentimelineio>=0.17",
]
dev = ["pytest>=8"]

[project.scripts]
director = "director.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["director"]

[tool.pytest.ini_options]
testpaths = ["tests"]
